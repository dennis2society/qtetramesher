name: Windows build

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the app and the file names, e.g. 0.8.6-rc1 (empty: from CMakeLists.txt)'
        required: false
        default: ''
      suffix:
        description: 'Appended to the version in the file names only, e.g. _test (optional)'
        required: false
        default: ''

env:
  SOFA_VERSION: 26.06.00
  GMSH_VERSION: 4.15.2
  BUILD_CONFIG: MinSizeRel
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
  # empty for tag builds; passed via env so they are never parsed as script code
  QTM_VERSION: ${{ inputs.version }}
  QTM_SUFFIX: ${{ inputs.suffix }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: fTetWild sources
        uses: actions/checkout@v4
        with:
          repository: wildmeshing/fTetWild
          path: ftetwild

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.*
          arch: win64_msvc2022_64
          cache: true

      - name: vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-cgal-assimp-v1

      - name: CGAL, assimp, Eigen (vcpkg)
        run: vcpkg install cgal assimp eigen3 --triplet x64-windows

      - name: SOFA
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: deps
          key: sofa-${{ env.SOFA_VERSION }}

      - name: Download SOFA
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps | Out-Null
          $v = $env:SOFA_VERSION
          Invoke-WebRequest "https://github.com/sofa-framework/sofa/releases/download/v$v/SOFA_v${v}_Win64.zip" -OutFile sofa.zip
          Expand-Archive sofa.zip deps/sofa

      # The official Windows SDK is built with MinGW; its C++ API cannot be linked with MSVC.
      - name: GMSH (MSVC build)
        uses: actions/cache@v4
        id: gmsh-cache
        with:
          path: gmsh-sdk
          key: gmsh-msvc-${{ env.GMSH_VERSION }}-v1

      - name: Build GMSH
        if: steps.gmsh-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest "https://gmsh.info/src/gmsh-$env:GMSH_VERSION-source.tgz" -OutFile gmsh-src.tgz
          tar -xf gmsh-src.tgz
          $src = "$PWD/gmsh-$env:GMSH_VERSION-source"
          cmake -S $src -B gmsh-build -G "Visual Studio 17 2022" -A x64 `
            -DENABLE_BUILD_SHARED=1 -DENABLE_OCC=0 -DENABLE_FLTK=0 `
            -DENABLE_PRIVATE_API=0 -DENABLE_MPI=0 -DENABLE_OPENMP=0
          if ($LASTEXITCODE) { exit 1 }
          cmake --build gmsh-build --config Release --target shared --parallel
          if ($LASTEXITCODE) { exit 1 }
          $sdk = "$PWD/gmsh-sdk"
          New-Item -ItemType Directory -Force "$sdk/include", "$sdk/lib", "$sdk/bin" | Out-Null
          Copy-Item "$src/api/gmsh.h" "$sdk/include"
          Get-ChildItem gmsh-build -Recurse -Filter 'gmsh*.lib' | Copy-Item -Destination "$sdk/lib"
          Get-ChildItem gmsh-build -Recurse -Filter 'gmsh*.dll' | Copy-Item -Destination "$sdk/bin"
          Get-ChildItem $sdk -Recurse | Select-Object -ExpandProperty FullName

      - name: Configure
        shell: pwsh
        run: |
          foreach ($v in $env:QTM_VERSION, $env:QTM_SUFFIX) {
            if ($v -and $v -notmatch '^[A-Za-z0-9._-]+$') {
              throw "Invalid version or suffix '$v' (allowed: letters, digits, . _ -)"
            }
          }
          $sofa = (Get-ChildItem deps/sofa -Directory | Select-Object -First 1).FullName
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR;C:/vcpkg/installed/x64-windows" `
            -DCMAKE_MAP_IMPORTED_CONFIG_MINSIZEREL=Release `
            "-DSOFA_INSTALL_DIR=$sofa" `
            "-DGMSH_INSTALL_PATH=$PWD/gmsh-sdk" `
            -DQTM_WITH_FTETWILD=ON `
            "-DFTETWILD_SOURCE_DIR=$PWD/ftetwild" `
            "-DQTM_VERSION_OVERRIDE=$env:QTM_VERSION"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_CONFIG }} --parallel

      - name: Portable zip and installer
        shell: pwsh
        run: |
          $version = $env:QTM_VERSION
          if (-not $version) {
            if ((Get-Content CMakeLists.txt -Raw) -notmatch 'project\(QTetraMesher VERSION ([\d.]+)\)') {
              throw 'Version not found in CMakeLists.txt'
            }
            $version = $Matches[1]
            if ((Get-Content CMakeLists.txt -Raw) -match 'set\(QTM_VERSION_SUFFIX\s+"([^"]*)"\)') {
              $version += $Matches[1]
            }
          }
          ./zz_installer_windows/collect_portable.ps1 -Config $env:BUILD_CONFIG `
            -Version $version -Suffix $env:QTM_SUFFIX -Clean -Zip
          ./zz_installer_windows/build_installer.ps1 -Config $env:BUILD_CONFIG `
            -Version $version -Suffix $env:QTM_SUFFIX -SkipCollect
          $name = "$version$env:QTM_SUFFIX"
          $files = "zz_installer_windows/QTetraMesher_Win64_${name}_portable.zip",
                   "zz_installer_windows/QTetraMesher_Setup_$name.exe"
          Get-FileHash $files -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content zz_installer_windows/SHA256SUMS-windows.txt
          "QTM_NAME=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: QTetraMesher-windows-${{ env.QTM_NAME }}
          path: |
            zz_installer_windows/QTetraMesher_Win64_*_portable.zip
            zz_installer_windows/QTetraMesher_Setup_*.exe
            zz_installer_windows/SHA256SUMS-windows.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zz_installer_windows/QTetraMesher_Win64_*_portable.zip
            zz_installer_windows/QTetraMesher_Setup_*.exe
            zz_installer_windows/SHA256SUMS-windows.txt
